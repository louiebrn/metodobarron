<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página Não Encontrada — Método Barron</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a09">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%' y1='0%' x2='100%' y2='100%'%3E%3Cstop offset='0%' stop-color='%23f2545a'/%3E%3Cstop offset='100%' stop-color='%23a4222b'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpolygon points='50,3 92,18 92,60 50,97 8,60 8,18' fill='url(%23g)'/%3E%3Ctext x='50' y='63' font-family='Arial, Helvetica, sans-serif' font-weight='900' font-size='42' fill='%23ffffff' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#0a0a09; --surface:#141412; --border:rgba(255,255,255,.09); --border-red:rgba(230,57,70,.4);
  --red:#e63946; --red-light:#f2545a; --red-dark:#a4222b;
  --text:#f5f4ef; --text-muted:#9a9c92; --text-dim:#68695f;
  --font-display:'Sora',system-ui,sans-serif; --font-body:'Manrope',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg); color:var(--text); font-family:var(--font-body); min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:28px;}
.brand-mark{width:44px; height:50px; margin:0 auto 28px; background:linear-gradient(155deg,var(--red-light),var(--red-dark)); clip-path:polygon(50% 0%,100% 16%,100% 62%,50% 100%,0% 62%,0% 16%); display:flex; align-items:center; justify-content:center;}
.brand-mark span{font-family:var(--font-display); font-weight:800; color:#fff; font-size:19px; margin-top:-2px;}
.code{font-family:var(--font-display); font-weight:800; font-size:clamp(64px,14vw,120px); line-height:1; background:linear-gradient(100deg,var(--red-light),var(--red) 60%,var(--red-dark)); -webkit-background-clip:text; background-clip:text; color:transparent;}
h1{font-family:var(--font-display); font-size:clamp(20px,3vw,26px); font-weight:700; margin:14px 0 12px;}
p{color:var(--text-muted); font-size:15px; max-width:400px; margin:0 auto 30px; line-height:1.7;}
.btn{display:inline-flex; align-items:center; gap:8px; padding:14px 26px; font-weight:700; font-size:14.5px; border-radius:100px; background:linear-gradient(100deg,var(--red-light),var(--red)); color:#fff; text-decoration:none; box-shadow:0 10px 26px -8px rgba(230,57,70,.5);}
</style>
</head>
<body>
<div>
  <div class="brand-mark"><span>B</span></div>
  <div class="code">404</div>
  <h1>Essa página não existe (ainda).</h1>
  <p>O link pode estar quebrado ou a página pode ter mudado de endereço. Vamos te levar de volta.</p>
  <a href="/" class="btn">Voltar ao Início</a>
</div>
</body>
</html>
