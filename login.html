<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Método Barron — Login</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #05080F; color: #E8EFF8; min-height: 100vh; display: flex; flex-direction: column; }
    :root { --navy: #05080F; --navy-mid: #0D1526; --navy-card: #111E35; --teal: #00C2D4; --gold: #F5A623; --white: #FFFFFF; --off-white: #E8EFF8; --muted: #6B85A8; --green: #22C55E; --red: #EF4444; --border: rgba(0,194,212,0.12); }
    h1,h2,h3 { font-family: 'Syne', sans-serif; }
    nav { background: rgba(5,8,15,0.92); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.2rem; color: var(--white); text-decoration: none; }
    .logo span { color: var(--teal); }
    .page { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; position: relative; overflow: hidden; }
    .page::before { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(0,194,212,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,194,212,0.03) 1px, transparent 1px); background-size: 60px 60px; pointer-events: none; }
    .page::after { content: ''; position: absolute; top: 30%; left: 50%; transform: translateX(-50%); width: 600px; height: 300px; background: radial-gradient(ellipse, rgba(0,194,212,0.07) 0%, transparent 70%); pointer-events: none; }
    .card { background: var(--navy-card); border: 1px solid var(--border); border-radius: 20px; padding: 2.5rem; width: 100%; max-width: 420px; position: relative; z-index: 1; }
    .card-eyebrow { display: inline-flex; align-items: center; gap: 0.5rem; background: rgba(0,194,212,0.1); border: 1px solid rgba(0,194,212,0.25); border-radius: 999px; padding: 0.3rem 0.9rem; font-size: 0.75rem; font-weight: 600; color: var(--teal); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 1.25rem; }
    .card-eyebrow::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--teal); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.4; transform:scale(0.7); } }
    .card h2 { font-size: 1.75rem; font-weight: 800; margin-bottom: 0.4rem; }
    .card p { font-size: 0.875rem; color: var(--muted); margin-bottom: 2rem; line-height: 1.6; }
    .form-group { margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--muted); margin-bottom: 0.5rem; letter-spacing: 0.03em; text-transform: uppercase; }
    input { width: 100%; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 10px; padding: 0.85rem 1rem; font-size: 0.95rem; color: var(--white); font-family: 'Inter', sans-serif; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
    input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(0,194,212,0.1); }
    input::placeholder { color: var(--muted); }
    .btn { width: 100%; padding: 0.95rem; border-radius: 10px; font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 700; cursor: pointer; border: none; transition: transform 0.2s, box-shadow 0.2s; margin-top: 0.5rem; }
    .btn-primary { background: var(--teal); color: var(--navy); box-shadow: 0 0 24px rgba(0,194,212,0.2); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 32px rgba(0,194,212,0.35); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .divider { display: flex; align-items: center; gap: 1rem; margin: 1.5rem 0; font-size: 0.8rem; color: var(--muted); }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .toggle-link { text-align: center; font-size: 0.875rem; color: var(--muted); margin-top: 1.5rem; }
    .toggle-link a { color: var(--teal); text-decoration: none; font-weight: 600; }
    .alert { padding: 0.85rem 1rem; border-radius: 10px; font-size: 0.875rem; margin-bottom: 1.25rem; display: none; }
    .alert.error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #FCA5A5; }
    .alert.success { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); color: #86EFAC; }
    .alert.show { display: block; }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(5,8,15,0.3); border-top-color: var(--navy); border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #forgot-view { display: none; }
  </style>
</head>
<body>
<nav>
  <a class="logo" href="index.html">Método<span>Barron</span></a>
</nav>
<div class="page">
  <div class="card">
    <div id="login-view">
      <div class="card-eyebrow">Área de Membros</div>
      <h2>Bem-vindo de volta</h2>
      <p>Acesse sua conta para continuar aprendendo ICT no NQ1 e ES1.</p>
      <div class="alert error" id="login-error"></div>
      <div class="alert success" id="login-success"></div>
      <div class="form-group"><label>Email</label><input type="email" id="login-email" placeholder="seu@email.com" /></div>
      <div class="form-group"><label>Senha</label><input type="password" id="login-password" placeholder="••••••••" /></div>
      <button class="btn btn-primary" id="login-btn" onclick="handleLogin()">Entrar</button>
      <div class="divider">ou</div>
      <div class="toggle-link"><a href="#" onclick="showForgot()">Esqueci minha senha</a></div>
    </div>
    <div id="forgot-view">
      <div class="card-eyebrow">Recuperar senha</div>
      <h2>Esqueceu a senha?</h2>
      <p>Digite seu email e enviaremos um link para criar uma nova senha.</p>
      <div class="alert error" id="forgot-error"></div>
      <div class="alert success" id="forgot-success"></div>
      <div class="form-group"><label>Email</label><input type="email" id="forgot-email" placeholder="seu@email.com" /></div>
      <button class="btn btn-primary" id="forgot-btn" onclick="handleForgot()">Enviar link de recuperação</button>
      <div class="divider">ou</div>
      <div class="toggle-link"><a href="#" onclick="showLogin()">← Voltar ao login</a></div>
    </div>
  </div>
</div>
<script>
  const SUPABASE_URL = 'https://canmukhomefokdfjrlcc.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhbm11a2hvbWVmb2tkZmpybGNjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNTg5MjQsImV4cCI6MjA5NjYzNDkyNH0.Aw93j4-lz6bHF3q4P9e75wHJzafddvzvwcQP0rhXdX4';
  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function checkSession() {
    const { data: { session } } = await sb.auth.getSession();
    if (session) window.location.href = 'members.html';
  }
  checkSession();

  async function handleLogin() {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const btn = document.getElementById('login-btn');
    const err = document.getElementById('login-error');
    const suc = document.getElementById('login-success');
    err.classList.remove('show'); suc.classList.remove('show');
    if (!email || !password) { err.textContent = 'Por favor preencha todos os campos.'; err.classList.add('show'); return; }
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Entrando...';
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { err.textContent = 'Email ou senha incorretos. Tente novamente.'; err.classList.add('show'); btn.disabled = false; btn.innerHTML = 'Entrar'; }
    else { suc.textContent = 'Login realizado! Redirecionando...'; suc.classList.add('show'); setTimeout(() => window.location.href = 'members.html', 1000); }
  }

  async function handleForgot() {
    const email = document.getElementById('forgot-email').value.trim();
    const btn = document.getElementById('forgot-btn');
    const err = document.getElementById('forgot-error');
    const suc = document.getElementById('forgot-success');
    err.classList.remove('show'); suc.classList.remove('show');
    if (!email) { err.textContent = 'Por favor insira seu email.'; err.classList.add('show'); return; }
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Enviando...';
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/members.html' });
    btn.disabled = false; btn.innerHTML = 'Enviar link de recuperação';
    if (error) { err.textContent = 'Erro ao enviar email. Tente novamente.'; err.classList.add('show'); }
    else { suc.textContent = 'Link enviado! Verifique seu email.'; suc.classList.add('show'); }
  }

  function showForgot() { document.getElementById('login-view').style.display = 'none'; document.getElementById('forgot-view').style.display = 'block'; }
  function showLogin() { document.getElementById('forgot-view').style.display = 'none'; document.getElementById('login-view').style.display = 'block'; }
  document.addEventListener('keydown', e => { if (e.key === 'Enter') { if (document.getElementById('login-view').style.display !== 'none') handleLogin(); else handleForgot(); } });
</script>
</body>
</html>
