<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checklist pré-mercado — Método Barron</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; color: #14181c; background: #f6f7f8; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 28px; line-height: 1.2; margin: 0 0 8px; }
  p { line-height: 1.5; color: #3d454c; }
  ol { list-style: none; padding: 0; margin: 24px 0; }
  li { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid #e2e6ea; }
  input { width: 18px; height: 18px; margin-top: 2px; }
  small { display: block; color: #5c6770; margin-top: 4px; }
  footer { margin-top: 28px; font-size: 13px; color: #5c6770; }
  @media print { body { background: #fff; } main { padding: 0; } }
</style>
</head>
<body>
<main>
  <p>Método Barron · material grátis</p>
  <h1>Checklist pré-mercado</h1>
  <p>Revise isto antes de abrir a plataforma. O objetivo é processo, não lucro do dia.</p>
  <ol>
    <li><input type="checkbox" id="c1"><label for="c1">Olhei a agenda econômica do dia<small>Horários em Brasília e o que pode mexer com NQ e ES.</small></label></li>
    <li><input type="checkbox" id="c2"><label for="c2">Marquei suporte e resistência no gráfico<small>Regiões, não chute de candle isolado.</small></label></li>
    <li><input type="checkbox" id="c3"><label for="c3">Defini o stop e o limite de perda do dia<small>Antes de pensar em alvo.</small></label></li>
    <li><input type="checkbox" id="c4"><label for="c4">Calculei o tamanho da posição<small>Regra do 1% e o valor do tick do contrato que vou usar.</small></label></li>
    <li><input type="checkbox" id="c5"><label for="c5">Confirmei que estou no simulador<small>Nenhuma ordem vai para a conta real.</small></label></li>
    <li><input type="checkbox" id="c6"><label for="c6">Sei a sessão de Nova York de hoje<small>9:30–16:00 no horário de Nova York.</small></label></li>
    <li><input type="checkbox" id="c7"><label for="c7">O diário de trades está aberto<small>Vou anotar gatilho, stop e o que senti.</small></label></li>
    <li><input type="checkbox" id="c8"><label for="c8">Não vou operar para “recuperar” uma perda<small>Sem FOMO e sem operação por vingança.</small></label></li>
  </ol>
  <footer>Conteúdo educacional. Não é recomendação de investimento. Método Barron.</footer>
</main>
</body>
</html>
